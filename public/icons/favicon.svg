<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
  role="img"
  aria-label="WebLogic"
>
  <!-- Dark navy rounded-square background -->
  <rect width="64" height="64" rx="14" fill="#020410" />

  <!-- LEFT bracket [ — larger + thicker so it survives 16px tab rendering -->
  <path
    d="M10 12h14v6h-8v28h8v6H10V12z"
    fill="#1d6efb"
  />

  <!-- RIGHT bracket ] — slightly lighter blue, mirrors the left -->
  <path
    d="M54 12H40v6h8v28h-8v6h14V12z"
    fill="#4d96ff"
  />

  <!-- </> code mark — only visible at 32px+, but adds detail on retina tabs -->
  <g
    stroke="#3b8bff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <!-- < -->
    <polyline points="28,24 22.5,32 28,40" />
    <!-- / slash -->
    <line x1="35" y1="22" x2="29" y2="42" />
    <!-- > -->
    <polyline points="36,24 41.5,32 36,40" />
  </g>
</svg>
